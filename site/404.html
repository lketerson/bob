<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Página não encontrada — BoB</title>
  <link rel="icon" href="/bob/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0f0f0e;
      color: #ece9e2;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 32rem; }
    p.code { margin: 0 0 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; letter-spacing: 0.08em; color: #d4a85a; }
    h1 { margin: 0 0 16px; font-size: clamp(2.2rem, 8vw, 3.4rem); line-height: 1; letter-spacing: -0.04em; }
    p { margin: 0 0 28px; color: #a09b90; }
    a { display: inline-block; padding: 12px 24px; background: #d4a85a; color: #14110a; font-weight: 600; text-decoration: none; border-radius: 4px; }
    a:hover { background: #e0b96f; }
    a:focus-visible { outline: 2px solid #d4a85a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Esse prego não está aqui.</h1>
    <p>A página que você procurou não existe ou mudou de endereço.</p>
    <a href="/bob/">Voltar ao início</a>
  </main>
</body>
</html>
